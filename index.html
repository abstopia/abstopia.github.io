<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>abstopia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hidden CSS-only toggle for Easter Egg #2 -->
  <input type="checkbox" id="singularity-toggle" aria-hidden="true">

  <main class="void">
    <!-- Pure CSS Black Hole -->
    <div class="cosmos" title="Approach the event horizon...">
      <div class="lensing-halo"></div>
      <div class="accretion-disk"></div>
      <div class="event-horizon">
        <span class="photon-ring"></span>
      </div>
      <div class="telemetry">r_s = 2GM/c² &nbsp;|&nbsp; τ → 0</div>
    </div>

    <header>
      <h1>abstopia</h1>
      <p class="sub">~/index — <span class="status">local-first</span></p>
    </header>

    <ul class="directory">
      <li>
        <a href="/about/">/about</a>
        <span class="desc">bio, hardware, notes</span>
      </li>
      <li>
        <a href="/myweb/">/myweb</a>
        <span class="desc">philosophy &amp; instrumentalism</span>
      </li>
      <li>
        <a href="https://github.com/abstopia">github</a>
        <span class="desc">repositories</span>
      </li>
    </ul>

    <!-- Easter Egg #3: Invisible until highlighted with cursor -->
    <p class="hidden-axiom">The representation is never the represented.</p>
  </main>

  <!-- Easter Egg #2 Trigger: Tiny pulsing pixel in bottom-right -->
  <label for="singularity-toggle" class="anomaly-dot" title="Collapse">·</label>
</body>
</html>
